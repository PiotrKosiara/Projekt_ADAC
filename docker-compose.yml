services:
  db:
    image: postgres:16-alpine
    container_name: biometrics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./backend
    container_name: biometrics_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODEL_ARTIFACT_DIR: ${MODEL_ARTIFACT_DIR}
      RAW_EVENTS_DIR: ${RAW_EVENTS_DIR}
      EXPORT_RAW_EVENTS: ${EXPORT_RAW_EVENTS}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/models_artifacts:/app/models_artifacts
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: biometrics_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  bot_runner:
    build:
      context: ./bot_runner
    container_name: biometrics_bot_runner
    env_file:
      - .env
    environment:
      BOT_TARGET_URL: ${BOT_TARGET_URL}
      BOT_VIDEO_DIR: /app/artifacts/videos
    depends_on:
      - frontend
      - backend
    volumes:
      - ./bot_runner:/app
      - ./bot_runner/artifacts:/app/artifacts
    command: ["sleep", "infinity"]

volumes:
  pgdata:
